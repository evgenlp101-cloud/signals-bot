name: Сигналы в Telegram

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверка сигналов
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          TD_KEY: ${{ secrets.TD_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS || 'BTCUSDT,ETHUSDT' }}
          INTERVAL: ${{ vars.INTERVAL || '1h' }}
          THRESHOLD: ${{ vars.THRESHOLD || '3' }}
          HTF_FILTER: ${{ vars.HTF_FILTER || 'on' }}
          TRADE_HOURS: ${{ vars.TRADE_HOURS }}
        run: python signals.py

      - name: Сохранить состояние
        run: |
          git config user.name  "signals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "состояние сигналов"
          git push
